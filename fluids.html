<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Fluids</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  color-scheme: dark;
  --bg: #0a0a0b;
  --bg-card: #111113;
  --text-1: #ffffff;
  --text-2: rgba(255,255,255,0.6);
  --text-3: rgba(255,255,255,0.4);
  --text-4: rgba(255,255,255,0.18);
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.14);
  --good: #6ee7b7;
  --warn: #fbbf24;
  --bad: #ff8a8a;
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, SF Mono, Menlo, Consolas, monospace;
  /* Water keeps the reference's own blue — it happens to sit well on a dark
     ground and holds white text at ~5:1, so the glass readout needs no tricks. */
  --water: #2E6F8E;
  --water-lite: #5FA3C0;
  --cola: #7A5238;
  /* The one structural break from the other tabs: square corners and heavy
     rules instead of 14-16px radii. Everything else is the shared token set. */
  --rule: 2px solid var(--border-strong);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, #14141a 0%, #0a0a0b 60%);
  color: var(--text-1);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  min-height: 100vh;
  overflow-x: hidden;
}
.shell { max-width: 680px; margin: 0 auto; padding: 0 16px 40px; }

/* ---- Masthead ---- */
.fl-masthead {
  padding: max(18px, env(safe-area-inset-top)) 0 12px;
  border-bottom: 4px solid var(--text-1);
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 14px; flex-wrap: wrap;
}
.fl-title {
  font-size: 24px; font-weight: 800; letter-spacing: -0.02em;
  line-height: 1; margin: 0; text-transform: uppercase;
}
.fl-kicker {
  font-size: 10px; font-weight: 700; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--text-3); margin-top: 7px;
}
.fl-stamp {
  font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--text-3); text-align: right;
}

/* ---- Layout ---- */
.fl-main {
  display: grid; grid-template-columns: 132px 1fr;
  gap: 20px; margin-top: 20px; align-items: start;
}

/* ---- The glass ---- */
.fl-glass {
  position: relative; height: 320px;
  border: 2px solid var(--border-strong);
  background: rgba(255,255,255,0.025);
  overflow: hidden;
  transition: border-color 0.15s;
}
.fl-glass.back { border-color: var(--warn); }
.fl-liquid {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--water);
  transition: height 0.45s cubic-bezier(0.2,0.7,0.3,1);
}
.fl-liquid::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0;
  height: 4px; background: var(--water-lite);
}
.fl-ticks { position: absolute; inset: 0; pointer-events: none; }
.fl-tick { position: absolute; left: 0; right: 0; border-top: 1px solid rgba(255,255,255,0.20); }
.fl-tick span {
  position: absolute; right: 4px; top: 2px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
  color: var(--text-3);
}
.fl-glass-read {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.fl-glass-oz {
  font-size: 34px; font-weight: 800; letter-spacing: -0.04em; line-height: 0.9;
  font-variant-numeric: tabular-nums;
}
.fl-glass-sub {
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--text-2); margin-top: 6px;
}

/* ---- Readout ---- */
.fl-readout { border-bottom: var(--rule); padding-bottom: 13px; }
.fl-big {
  font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.fl-big small {
  font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--text-3); text-transform: uppercase;
}
.fl-sub {
  font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-3); margin-top: 7px;
}
.fl-sub.done { color: var(--good); }

/* ---- Section headings ---- */
.fl-sec, .fl-sec-row h4 {
  font-size: 10px; font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--text-3);
  margin: 0; padding: 0; border: 0;
}
.fl-sec { margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-strong); }
.fl-sec-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-strong);
}

/* ---- Preset drinks ---- */
.fl-drinks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 9px; }
.fl-drink {
  appearance: none; -webkit-appearance: none; cursor: pointer;
  background: rgba(255,255,255,0.03);
  border: 2px solid var(--border-strong);
  border-radius: 0;
  padding: 12px 12px 10px; text-align: left;
  font-family: var(--font); color: var(--text-1);
  display: flex; flex-direction: column; gap: 5px;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s;
}
.fl-drink b { font-size: 13.5px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; }
.fl-drink em {
  font-style: normal; font-size: 10px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3);
}
.fl-drink .fl-swatch { height: 4px; background: var(--water); margin-top: 3px; }
.fl-drink.seltzer .fl-swatch { background: var(--water-lite); }
.fl-drink.soda   .fl-swatch { background: var(--cola); }
/* The one shadow the design allows: a hard offset block, inverted to light
   because this sits on a dark ground. Fires on tap as well as hover so it
   still reads as a press on a phone. */
.fl-drink:hover, .fl-drink:active {
  transform: translate(-2px,-2px);
  box-shadow: 4px 4px 0 var(--text-1);
  border-color: var(--text-1);
}
.fl-drink:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }

/* ---- Inputs & buttons ---- */
.fl-custom { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-top: 11px; }
.fl-label {
  display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.13em;
  text-transform: uppercase; color: var(--text-3); margin-bottom: 5px;
}
.fl-input {
  font-family: var(--font); font-size: 15px; color: var(--text-1);
  background: rgba(0,0,0,0.28); border: 2px solid var(--border-strong);
  border-radius: 0; padding: 8px 10px; width: 116px; outline: none;
}
.fl-input:focus { border-color: var(--text-2); }
.fl-btn {
  appearance: none; -webkit-appearance: none; cursor: pointer;
  background: var(--text-1); color: #0a0a0b;
  border: 2px solid var(--text-1); border-radius: 0;
  font-family: var(--font); font-size: 11.5px; font-weight: 700;
  letter-spacing: 0.13em; text-transform: uppercase; padding: 9px 15px;
  -webkit-tap-highlight-color: transparent;
}
.fl-btn.ghost { background: transparent; color: var(--text-1); border-color: var(--border-strong); }
.fl-btn.ghost:hover, .fl-btn.ghost:active { border-color: var(--text-1); }
.fl-btn:focus-visible { outline: 2px solid var(--warn); outline-offset: 1px; }
.fl-select {
  font-family: var(--font); font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-1); background: rgba(0,0,0,0.28);
  border: 2px solid var(--border-strong); border-radius: 0;
  padding: 5px 7px; outline: none;
}
.fl-select.back { border-color: var(--warn); color: var(--warn); }
.fl-foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ---- Backdating warning ---- */
.fl-backnote {
  border: 2px solid var(--warn);
  background: rgba(251,191,36,0.08);
  color: var(--warn);
  padding: 9px 11px; margin: 14px 0 0;
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
}

/* ---- Entry log ---- */
.fl-log { border: 2px solid var(--border-strong); background: rgba(255,255,255,0.02); }
.fl-log-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-bottom: 1px solid var(--border);
}
.fl-log-row:last-child { border-bottom: 0; }
.fl-log-row .n { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-log-row .t {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-3); white-space: nowrap;
}
.fl-log-row .oz {
  font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.fl-x {
  appearance: none; background: none; border: 0; cursor: pointer;
  color: var(--bad); font-size: 12px; font-weight: 700; padding: 3px 4px;
  -webkit-tap-highlight-color: transparent;
}
.fl-none { font-size: 13px; color: var(--text-3); padding: 15px 0; margin: 0; }

/* ---- 14-day history ---- */
.fl-hist { margin-top: 4px; }
.fl-hrow {
  cursor: pointer; display: grid; grid-template-columns: 74px 1fr 56px;
  align-items: center; gap: 10px; padding: 7px 0;
  border-bottom: 1px solid var(--border);
  -webkit-tap-highlight-color: transparent;
}
.fl-hrow:last-child { border-bottom: 0; }
.fl-hrow .d {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-3);
}
.fl-hrow.now .d, .fl-hrow.now .v { color: var(--text-1); }
.fl-hrow.sel { box-shadow: 0 0 0 2px var(--warn); }
.fl-hrow .b {
  height: 9px; background: rgba(255,255,255,0.06);
  border: 1px solid var(--border-strong); overflow: hidden;
}
.fl-hrow .b i { display: block; height: 100%; background: var(--water); }
.fl-hrow .b i.hit { background: var(--good); }
.fl-hrow .v {
  font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
  text-align: right; color: var(--text-3); font-variant-numeric: tabular-nums;
}

@media (max-width: 600px) {
  .fl-main { grid-template-columns: 1fr; }
  .fl-glass { height: 160px; }
  .fl-glass-oz { font-size: 30px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .fl-drink:hover, .fl-drink:active { transform: none; }
}
</style>
</head>
<body>
<div class="shell">

  <header class="fl-masthead">
    <div>
      <h1 class="fl-title">Fluids</h1>
      <div class="fl-kicker">One gallon a day</div>
    </div>
    <div class="fl-stamp" id="flStamp">—</div>
  </header>

  <div class="fl-main">
    <div class="fl-glass" id="flGlass">
      <div class="fl-liquid" id="flLiquid" style="height:0%"></div>
      <div class="fl-ticks" id="flTicks"></div>
      <div class="fl-glass-read">
        <div class="fl-glass-oz" id="flGlassOz">0</div>
        <div class="fl-glass-sub">fl oz</div>
      </div>
    </div>

    <div>
      <div class="fl-readout">
        <div class="fl-big" id="flBig">0 <small>/ 128 fl oz</small></div>
        <div class="fl-sub" id="flSub">—</div>
      </div>

      <div id="flBacknote"></div>

      <h4 class="fl-sec">Add a drink</h4>
      <div class="fl-drinks" id="flDrinks"></div>

      <div class="fl-custom">
        <div>
          <label class="fl-label" for="flCustomOz">Something else</label>
          <input class="fl-input" id="flCustomOz" type="number" min="1" step="0.1"
                 inputmode="decimal" placeholder="fl oz">
        </div>
        <button class="fl-btn" id="flAddCustom">Add</button>
      </div>

      <div class="fl-sec-row">
        <h4 id="flLogHead">Logged today</h4>
        <select class="fl-select" id="flDaySel" aria-label="Which day to log to"></select>
      </div>
      <div id="flLogView"></div>

      <div class="fl-foot">
        <button class="fl-btn ghost" id="flUndo">Undo last</button>
        <button class="fl-btn ghost" id="flClear">Clear day</button>
      </div>

      <h4 class="fl-sec">Last 14 days</h4>
      <div class="fl-hist" id="flHist"></div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  const LOG_KEY = 'fluids_log_v1';
  const GOAL    = 128;   // US gallon, fl oz
  const DAYS    = 14;    // how much history we keep

  const DRINKS = [
    { name: 'Water bottle, 1 L',     oz: 33.8, cls: '' },
    { name: 'Poland Spring, 500 mL', oz: 16.9, cls: '' },
    { name: 'Polar Seltzer can',     oz: 12,   cls: 'seltzer' },
    { name: 'Diet Coke, 12 oz',      oz: 12,   cls: 'soda' },
    { name: 'Diet Coke mini',        oz: 7.5,  cls: 'soda' }
  ];

  // ---- Dates: always LOCAL. Never toISOString() — that rolls late-evening
  // entries onto the next day for anyone west of UTC.
  function ymd(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }
  function todayStr() { return ymd(new Date()); }
  function keyForOffset(i) { const d = new Date(); d.setDate(d.getDate() - i); return d; }
  function dayLabel(dateObj, i) {
    if (i === 0) return 'Today';
    if (i === 1) return 'Yesterday';
    return dateObj.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric' });
  }
  function labelForKey(k) {
    for (let i = 0; i < DAYS; i++) {
      const d = keyForOffset(i);
      if (ymd(d) === k) return dayLabel(d, i);
    }
    return k;
  }

  const round = (n, d) => { const m = Math.pow(10, d || 0); return Math.round(n * m) / m; };
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ---- State ----
  // { log: { 'YYYY-MM-DD': { entries: [{name, oz, t}], updatedAt } } }
  // Each day carries its own updatedAt so cross-device merges can tell a
  // deletion from a not-yet-seen addition — same shape budget.html uses
  // for weeks, and the reason a stale device can't wipe a day here.
  function normalizeDay(rec) {
    if (Array.isArray(rec)) return { entries: rec.slice(), updatedAt: 0 };  // pre-merge shape
    if (!rec || typeof rec !== 'object') return null;
    return {
      entries: Array.isArray(rec.entries) ? rec.entries.slice() : [],
      updatedAt: Number(rec.updatedAt) || 0
    };
  }
  function pruneLog(log) {
    const out = {};
    Object.keys(log).sort().slice(-DAYS).forEach(k => { out[k] = log[k]; });
    return out;
  }
  function loadState() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(LOG_KEY)); } catch (e) {}
    const log = {};
    if (raw && raw.log && typeof raw.log === 'object') {
      Object.keys(raw.log).forEach(k => {
        const rec = normalizeDay(raw.log[k]);
        if (rec) log[k] = rec;
      });
    }
    return { log: pruneLog(log) };
  }
  function saveState() {
    state.log = pruneLog(state.log);
    localStorage.setItem(LOG_KEY, JSON.stringify(state));
  }
  function dayRec(k, create) {
    let rec = state.log[k];
    if (!rec && create) { rec = state.log[k] = { entries: [], updatedAt: 0 }; }
    return rec || null;
  }
  function entriesOf(k) { const r = state.log[k]; return (r && r.entries) || []; }
  function dayTotal(k) { return entriesOf(k).reduce((s, e) => s + (Number(e.oz) || 0), 0); }
  // Stamp the day that changed, not the document — that stamp is what the
  // merge compares, so an edit here always beats a stale copy elsewhere.
  function touch(k) { const r = dayRec(k, true); r.updatedAt = Date.now(); saveState(); }

  let state = loadState();
  let sel   = todayStr();   // the day new entries land on, and the day shown

  // ---- Mutations ----
  function addEntry(name, oz) {
    const rec = dayRec(sel, true);
    rec.entries.push({
      name: name,
      oz: Number(oz),
      t: sel === todayStr()
        ? new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
        : 'added later'
    });
    touch(sel); render();
  }
  function removeAt(i) {
    const rec = dayRec(sel, false);
    if (!rec || i < 0 || i >= rec.entries.length) return;
    rec.entries.splice(i, 1);
    touch(sel); render();
  }
  function undoLast() {
    const rec = dayRec(sel, false);
    if (!rec || !rec.entries.length) return;
    rec.entries.pop();
    touch(sel); render();
  }
  function clearDay() {
    const rec = dayRec(sel, false);
    if (!rec || !rec.entries.length) return;
    if (!confirm('Clear everything logged on ' + labelForKey(sel).toLowerCase() + '?')) return;
    // Emptied, not deleted — the merge unions by date key, so a removed key
    // would just come back from another device on the next pull.
    rec.entries = [];
    touch(sel); render();
  }

  // ---- Render ----
  function renderTicks() {
    document.getElementById('flTicks').innerHTML = [25, 50, 75].map(p =>
      '<div class="fl-tick" style="bottom:' + p + '%"><span>' + round(GOAL * p / 100) + '</span></div>'
    ).join('');
  }
  function renderDrinks() {
    document.getElementById('flDrinks').innerHTML = DRINKS.map((d, i) =>
      '<button class="fl-drink ' + d.cls + '" data-add="' + i + '">' +
        '<b>' + esc(d.name) + '</b>' +
        '<em>' + d.oz + ' fl oz</em>' +
        '<div class="fl-swatch"></div>' +
      '</button>'
    ).join('');
  }
  function renderDaySel() {
    const back = sel !== todayStr();
    document.getElementById('flDaySel').innerHTML = Array.from({ length: DAYS }, (_, i) => {
      const d = keyForOffset(i), k = ymd(d);
      return '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' +
        esc(dayLabel(d, i)) + '</option>';
    }).join('');
    document.getElementById('flDaySel').classList.toggle('back', back);
    document.getElementById('flLogHead').textContent = back ? 'Logged that day' : 'Logged today';
    document.getElementById('flGlass').classList.toggle('back', back);
    document.getElementById('flBacknote').innerHTML = back
      ? '<div class="fl-backnote">⚠ Adding to ' + esc(labelForKey(sel)) + ' — not today</div>'
      : '';
  }
  function renderHist() {
    const rows = [];
    let max = GOAL;
    for (let i = 0; i < DAYS; i++) {
      const d = keyForOffset(i), k = ymd(d), v = dayTotal(k);
      if (v > max) max = v;
      rows.push({ i: i, k: k, v: v, label: dayLabel(d, i) });
    }
    document.getElementById('flHist').innerHTML = rows.map(r =>
      '<div class="fl-hrow' + (r.i === 0 ? ' now' : '') + (r.k === sel ? ' sel' : '') + '" data-day="' + r.k + '">' +
        '<span class="d">' + esc(r.label) + '</span>' +
        '<span class="b"><i class="' + (r.v >= GOAL ? 'hit' : '') + '" style="width:' + (max ? r.v / max * 100 : 0) + '%"></i></span>' +
        '<span class="v">' + (r.v ? round(r.v) + ' oz' : '—') + '</span>' +
      '</div>'
    ).join('');
  }
  function renderLog() {
    const list = entriesOf(sel);
    document.getElementById('flLogView').innerHTML = list.length
      ? '<div class="fl-log">' + list.map((e, i) =>
          '<div class="fl-log-row">' +
            '<span class="n">' + esc(e.name) + '</span>' +
            '<span class="t">' + esc(e.t) + '</span>' +
            '<span class="oz">' + round(e.oz, 1) + ' oz</span>' +
            '<button class="fl-x" data-x="' + i + '" aria-label="Remove">✕</button>' +
          '</div>'
        ).join('') + '</div>'
      : '<p class="fl-none">Nothing logged ' + (sel === todayStr() ? 'yet today.' : 'that day.') + '</p>';
  }
  function render() {
    renderDaySel();
    renderHist();
    renderLog();

    const [y, m, d] = sel.split('-').map(Number);
    document.getElementById('flStamp').textContent =
      new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });

    const total = dayTotal(sel);
    const pct   = Math.min(total / GOAL * 100, 100);
    document.getElementById('flLiquid').style.height = pct + '%';
    document.getElementById('flGlassOz').textContent = round(total);
    document.getElementById('flBig').innerHTML =
      round(total) + ' <small>/ ' + GOAL + ' fl oz</small>';

    const left = GOAL - total;
    const sub  = document.getElementById('flSub');
    if (left <= 0) {
      sub.textContent = 'Gallon done — ' + round(-left) + ' oz over';
      sub.classList.add('done');
    } else {
      sub.textContent = round(left) + ' oz to go · ' + round(left / 33.8, 1) + ' L bottles';
      sub.classList.remove('done');
    }
  }

  // ---- Events ----
  document.getElementById('flDrinks').addEventListener('click', e => {
    const btn = e.target.closest('[data-add]');
    if (!btn) return;
    const d = DRINKS[parseInt(btn.dataset.add, 10)];
    if (d) addEntry(d.name, d.oz);
  });
  document.getElementById('flLogView').addEventListener('click', e => {
    const btn = e.target.closest('[data-x]');
    if (btn) removeAt(parseInt(btn.dataset.x, 10));
  });
  document.getElementById('flHist').addEventListener('click', e => {
    const row = e.target.closest('[data-day]');
    if (row) { sel = row.dataset.day; render(); }
  });
  document.getElementById('flDaySel').addEventListener('change', e => { sel = e.target.value; render(); });

  function addCustom() {
    const input = document.getElementById('flCustomOz');
    const v = parseFloat(input.value);
    if (!(v > 0)) return;
    addEntry('Other', v);
    input.value = '';
  }
  document.getElementById('flAddCustom').addEventListener('click', addCustom);
  document.getElementById('flCustomOz').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addCustom(); }
  });
  document.getElementById('flUndo').addEventListener('click', undoLast);
  document.getElementById('flClear').addEventListener('click', clearDay);

  // ---- Cloud sync merge ----
  // Union by date key, newest updatedAt wins, ties go to the fuller day.
  // Mirrors mergeBudgetWeeks so all three synced pages behave the same way.
  function mergeFluidLog(local, remote) {
    const out = {};
    function take(val) {
      const log = val && val.log;
      if (!log || typeof log !== 'object') return;
      Object.keys(log).forEach(k => {
        const rec = normalizeDay(log[k]);
        if (!rec) return;
        const ex = out[k];
        if (!ex) { out[k] = rec; return; }
        const eu = Number(ex.updatedAt) || 0, ru = Number(rec.updatedAt) || 0;
        if (ru !== eu) { if (ru > eu) out[k] = rec; return; }
        if (rec.entries.length > ex.entries.length) out[k] = rec;
      });
    }
    take(local); take(remote);
    return { log: pruneLog(out) };
  }
  window.__fluidsMergeFns = { fluids_log_v1: mergeFluidLog };
  window.__fluidsSyncApplied = function () {
    state = loadState();
    if (sel !== todayStr() && !state.log[sel]) sel = todayStr();
    render();
  };

  // A tab left open across midnight would keep logging into yesterday and draw
  // a stale history strip, so re-anchor when the day changes underneath us.
  let anchorDay = todayStr();
  function checkDayRollover() {
    const now = todayStr();
    if (now === anchorDay) return;
    if (sel === anchorDay) sel = now;   // was following "today" — keep following it
    anchorDay = now;
    render();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDayRollover(); });
  window.addEventListener('focus', checkDayRollover);
  setInterval(checkDayRollover, 60000);

  renderTicks();
  renderDrinks();
  render();
})();
</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (typeof initCloudSync !== 'function') return;
  initCloudSync({
    appKey: 'fluids',
    syncedKeys: ['fluids_log_v1'],
    merge: window.__fluidsMergeFns || {},
    onApplied: function () {
      if (typeof window.__fluidsSyncApplied === 'function') window.__fluidsSyncApplied();
    }
  });
});
</script>
