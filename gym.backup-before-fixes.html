		'Quad movement 2': ['Leg press', 'Back squat', 'Leg extension', 'Split squat'],

		'Lat pulldown': ['Wide-grip lat pulldown', 'Close-grip lat pulldown', 'Underhand lat pulldown', 'Pull-ups'],
		'Chest': ['Bench press', 'Chest press', 'Dips', 'Pec deck'],
		'Rear delts': ['Face pull', 'Rear delt fly', 'Cable delt fly'],
		'Bicep movement': ['Cable curl', 'Preacher curl', 'Hammer curl'],
		'Tricep movement': ['Rope pushdown', 'Straight bar pushdown', 'Overhead tricep extension'],
		'Side delts': ['Cable lateral raise', 'Dumbbell lateral raise', 'Machine lateral raise'],
		'Row': ['Barbell row', 'Cable row', 'Chest-supported row'],
		'Incline press': ['Incline bench press', 'Incline chest press'],
		'Shoulder movement': ['Shoulder press', 'Shoulder fly'],
		'Pec deck': ['Pec deck']
	};
	var style = document.createElement('style');
	style.textContent = '.variation-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.choice{min-height:32px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted);background:var(--panel);font-size:11px;line-height:1.1}.choice.active{color:#102016;background:var(--green);border-color:var(--green)}.ex-note{display:none}.status-stack{text-align:right}.completion{margin-top:5px;color:var(--amber);font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase}#exercises{display:flex;flex-direction:column}.ex.completed{opacity:.52;order:2;transition:opacity .2s}.ex.completed .ex-name{text-decoration:line-through}.ex.completed .input,.ex.completed .check{filter:grayscale(.7)}.completed-divider{order:1;margin:16px 0 0;padding:10px 0 4px;border-top:1px solid var(--line);color:var(--faint);font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase}';
	document.head.appendChild(style);
	function readState() {
		try {
			var saved = localStorage.getItem(variationKey) || localStorage.getItem('forge_training_v3') || '{}';
			return JSON.parse(saved);
		} catch (e) { return {}; }
	}
	function weightValues(card) {
		return Array.prototype.map.call(card.querySelectorAll('[data-field="weight"]'), function (input) {
			return input.value;
		});
	}
	function asWeightValues(saved, fallback) {
		if (Array.isArray(saved)) return saved.slice();
		if (saved != null) return fallback.map(function () { return String(saved); });
		return fallback.slice();
	}
	function workoutVariationWeights(selected) {
		try {
			var workout = JSON.parse(localStorage.getItem('forge_training_v3') || '{}');
			var dates = Object.keys(workout.sessions || {}).sort().reverse();
			for (var i = 0; i < dates.length; i++) {
				var setsById = workout.sessions[dates[i]].sets || {};
				for (var id in setsById) {
					var sets = setsById[id] || [];
					var values = sets.map(function (set) { return set.variation === selected && set.weight != null ? String(set.weight) : null; }).filter(function (value) { return value != null; });
					if (values.length) return values;
				}
			}
		} catch (e) {}
		return null;
	}
	function savedVariationWeights(state, cardId, selected, fallback) {
		state.weightsByVariation = state.weightsByVariation || {};
		if (state.weightsByVariation[selected]) return state.weightsByVariation[selected];
		var fromWorkout = workoutVariationWeights(selected);
		if (fromWorkout) return fromWorkout;
		var bySlot = state.weights[cardId] && state.weights[cardId][selected];
		if (bySlot != null) return bySlot;
		return fallback;
	}
	function syncWorkoutState(card, values, selected) {
		try {
			var workout = JSON.parse(localStorage.getItem('forge_training_v3') || '{}');
			var current = workout.sessions && workout.sessions[new Date().toISOString().slice(0, 10)];
			var sets = current && current.sets && current.sets[card.dataset.id];
			if (!sets) return;
			sets.forEach(function (set, index) {
				if (values[index] != null) set.weight = values[index];
				set.variation = selected;
			});
			localStorage.setItem('forge_training_v3', JSON.stringify(workout));
		} catch (e) {}
	}
	function decorate() {
		document.querySelectorAll('#exercises .ex').forEach(function (card) {
			var old = card.querySelector('[data-choice]');
			if (!old) return;
			var label = card.querySelector('.ex-name').textContent;
			var list = choices[label] || [label];
			var state = readState();
			state.choices = state.choices || {};
			state.weights = state.weights || {};
			state.weights[card.dataset.id] = state.weights[card.dataset.id] || {};
			var selected = state.choices[card.dataset.id] || list[0];
			var wrap = document.createElement('div');
			wrap.className = 'variation-list';
			list.forEach(function (name, index) {
				var button = document.createElement('button');
				button.type = 'button';
				button.className = 'choice' + (name === selected ? ' active' : '');
				button.dataset.option = String(index);
				button.textContent = name;
				wrap.appendChild(button);
			});
			var savedWeights = savedVariationWeights(state, card.dataset.id, selected, weightValues(card));
			var values = asWeightValues(savedWeights, weightValues(card));
			card.querySelectorAll('[data-field="weight"]').forEach(function (input, index) {
				if (values[index] != null) input.value = values[index];
			});
			old.replaceWith(wrap);
		});
	}
	document.addEventListener('click', function (event) {
		var button = event.target.closest('#exercises .choice');
		if (!button) return;
		event.preventDefault();
		event.stopImmediatePropagation();
		var card = button.closest('.ex');
		var label = card.querySelector('.ex-name').textContent;
		var list = choices[label] || [label];
		var state = readState();
		state.choices = state.choices || {};
		state.weights = state.weights || {};
		state.weights[card.dataset.id] = state.weights[card.dataset.id] || {};
		var currentChoice = state.choices[card.dataset.id] || list[0];
		var currentValues = weightValues(card);
		if (state.weights[card.dataset.id][currentChoice] == null) state.weights[card.dataset.id][currentChoice] = currentValues.slice();
		state.choices[card.dataset.id] = list[Number(button.dataset.option)];
		var nextChoice = state.choices[card.dataset.id];
		var nextValues = asWeightValues(savedVariationWeights(state, card.dataset.id, nextChoice, currentValues), currentValues);
		state.weights[card.dataset.id][nextChoice] = nextValues.slice();
		state.weightsByVariation[nextChoice] = nextValues.slice();
		localStorage.setItem(variationKey, JSON.stringify(state));
		card.querySelectorAll('[data-field="weight"]').forEach(function (input, index) {
			if (nextValues[index] != null) input.value = nextValues[index];
		});
		syncWorkoutState(card, nextValues, nextChoice);
		card.querySelectorAll('[data-field="weight"]').forEach(function (input) {
			input.dispatchEvent(new Event('input', { bubbles: true }));
		});
		card.querySelectorAll('.choice').forEach(function (item) { item.classList.toggle('active', item === button); });
	}, true);
	document.addEventListener('input', function (event) {
		var input = event.target.closest('#exercises [data-field="weight"]');
		if (!input) return;
		var card = input.closest('.ex'), label = card.querySelector('.ex-name').textContent;
		var list = choices[label] || [label], state = readState();
		state.choices = state.choices || {};
		state.weights = state.weights || {};
		state.weights[card.dataset.id] = state.weights[card.dataset.id] || {};
		var selected = state.choices[card.dataset.id] || list[0];
		var values = asWeightValues(savedVariationWeights(state, card.dataset.id, selected, weightValues(card)), weightValues(card));
		values[Number(input.dataset.i)] = input.value;
		state.weights[card.dataset.id][selected] = values;
		state.weightsByVariation[selected] = values.slice();
		localStorage.setItem(variationKey, JSON.stringify(state));
	}, true);
	var exercises = document.getElementById('exercises');
	if (exercises) new MutationObserver(decorate).observe(exercises, { childList: true, subtree: true });
	decorate();
}());
</script></body></html>
