<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Meals</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg: #0a0a0b;
  --bg-card: #111113;
  --text-1: #ffffff;
  --text-2: rgba(255,255,255,0.6);
  --text-3: rgba(255,255,255,0.4);
  --text-4: rgba(255,255,255,0.18);
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.14);
  --good: #6ee7b7;
  --warn: #fbbf24;
  --bad: #ff8a8a;
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, SF Mono, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, #14141a 0%, #0a0a0b 60%);
  color: var(--text-1);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  min-height: 100vh;
  overflow-x: hidden;
}
.shell {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 16px calc(90px + env(safe-area-inset-bottom));
}

/* Header */
.meals-header { padding: max(18px, env(safe-area-inset-top)) 0 14px; }
.meals-title { font-size: 22px; font-weight: 700; letter-spacing: -0.015em; }
.meals-sub { font-size: 12px; color: var(--text-3); margin-top: 3px; }

/* Search */
.meals-search-wrap { position: relative; margin-bottom: 14px; }
.meals-search {
  width: 100%; padding: 12px 14px 12px 38px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text-1); font-family: var(--font); font-size: 14px;
  outline: none; -webkit-appearance: none;
  transition: border-color 0.15s;
}
.meals-search:focus { border-color: rgba(110,231,183,0.4); }
.meals-search::placeholder { color: var(--text-3); }
.meals-search-icon {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  color: var(--text-3); pointer-events: none; display: flex;
}

/* List */
.meals-list { display: flex; flex-direction: column; gap: 8px; }
.meal-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  display: flex; align-items: center; gap: 14px;
  animation: meal-in 0.2s ease;
}
@keyframes meal-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
.meal-main { flex: 1; min-width: 0; }
.meal-name {
  font-size: 14.5px; font-weight: 600; color: var(--text-1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.meal-meta {
  font-size: 11px; color: var(--text-3); margin-top: 3px;
  font-variant-numeric: tabular-nums;
}
.meal-macros { text-align: right; flex-shrink: 0; }
.meal-cal {
  font-size: 16px; font-weight: 700; color: var(--warn);
  font-variant-numeric: tabular-nums;
}
.meal-cal span { font-size: 11px; color: var(--text-3); font-weight: 500; }
.meal-prot {
  font-size: 12px; font-weight: 600; color: var(--good);
  font-variant-numeric: tabular-nums; margin-top: 2px;
}

/* States */
.meals-empty {
  text-align: center; padding: 60px 24px;
  color: var(--text-3);
}
.meals-empty-icon { font-size: 40px; margin-bottom: 14px; filter: grayscale(15%); }
.meals-empty-title { font-size: 15px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.meals-empty-sub { font-size: 13px; line-height: 1.5; }
.meals-loading { text-align: center; padding: 40px; color: var(--text-3); font-size: 13px; }
.meals-loading .spin {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.12); border-top-color: rgba(255,255,255,0.55);
  border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .shell { padding-left: 12px; padding-right: 12px; }
  .meals-title { font-size: 20px; }
}
</style>
</head>
<body>
<div class="shell">

  <div class="meals-header">
    <div class="meals-title">Meals</div>
    <div class="meals-sub" id="mealsSub">Loading your meal library…</div>
  </div>

  <div class="meals-search-wrap">
    <span class="meals-search-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
    <input class="meals-search" id="mealsSearch" type="text" placeholder="Search your meals…" autocomplete="off">
  </div>

  <div class="meals-loading" id="mealsLoading"><span class="spin"></span>Pulling your saved meals…</div>
  <div class="meals-list" id="mealsList"></div>
  <div class="meals-empty" id="mealsEmpty" style="display:none">
    <div class="meals-empty-icon">🍽️</div>
    <div class="meals-empty-title">No meals saved yet</div>
    <div class="meals-empty-sub">Log food in the Food tab and every meal<br>you track will be collected here.</div>
  </div>

</div>

<script>
(function () {
  'use strict';

  const SUPABASE_URL = 'https://jvdxtaosxicsvpskpflb.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_TuBx-uqMoGKOZJmYJDqvMw_80G5Bk4h';
  const LOG_KEY  = 'food_log_v1';
  const HIST_KEY = 'food_history_v1';
  // Synthetic / non-meal entry names produced by the tracker that shouldn't appear as meals.
  const SKIP_NAMES = new Set(['previously logged', 'full day total', 'unknown', '']);

  let meals = [];      // aggregated [{name, calories, protein, count, last}]
  let filter = '';

  function safeParse(raw) { try { return JSON.parse(raw); } catch { return null; } }
  function dayToTs(dateStr) {
    if (!dateStr) return 0;
    const [y, m, d] = String(dateStr).split('-').map(Number);
    return new Date(y, (m || 1) - 1, d || 1, 12, 0, 0).getTime();
  }

  // Flatten every logged entry from a {log, history} food state into a list of
  // { name, calories, protein, ts } records.
  function entriesFrom(state) {
    const out = [];
    if (!state) return out;
    const log = state[LOG_KEY];
    if (log && Array.isArray(log.entries)) {
      log.entries.forEach(e => {
        if (!e || !e.name) return;
        out.push({ name: e.name, calories: +e.calories || 0, protein: +e.protein || 0, ts: e.time ? Date.parse(e.time) || 0 : Date.now() });
      });
    }
    const hist = state[HIST_KEY];
    if (Array.isArray(hist)) {
      hist.forEach(day => {
        if (!day || !Array.isArray(day.entries)) return;
        const ts = dayToTs(day.date);
        day.entries.forEach(e => {
          if (!e || !e.name) return;
          out.push({ name: e.name, calories: +e.calories || 0, protein: +e.protein || 0, ts });
        });
      });
    }
    return out;
  }

  function aggregate(records) {
    const byName = {};
    records.forEach(r => {
      const key = String(r.name).trim().toLowerCase();
      if (SKIP_NAMES.has(key)) return;
      const ex = byName[key];
      if (!ex) {
        byName[key] = { name: r.name.trim(), calories: r.calories, protein: r.protein, count: 1, last: r.ts };
      } else {
        ex.count += 1;
        if (r.ts >= ex.last) { ex.last = r.ts; ex.name = r.name.trim(); ex.calories = r.calories; ex.protein = r.protein; }
      }
    });
    return Object.values(byName).sort((a, b) => b.last - a.last);
  }

  function fmtDate(ts) {
    if (!ts) return '';
    return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render() {
    const listEl = document.getElementById('mealsList');
    const emptyEl = document.getElementById('mealsEmpty');
    const subEl = document.getElementById('mealsSub');

    subEl.textContent = meals.length
      ? meals.length + ' meal' + (meals.length === 1 ? '' : 's') + ' saved by your tracker'
      : 'No meals saved yet';

    const f = filter.trim().toLowerCase();
    const shown = f ? meals.filter(m => m.name.toLowerCase().includes(f)) : meals;

    if (!meals.length) { listEl.innerHTML = ''; emptyEl.style.display = 'block'; return; }
    emptyEl.style.display = 'none';

    if (!shown.length) {
      listEl.innerHTML = '<div class="meals-empty" style="padding:40px"><div class="meals-empty-sub">No meals match “' + esc(filter) + '”.</div></div>';
      return;
    }

    listEl.innerHTML = shown.map(m =>
      '<div class="meal-card">' +
        '<div class="meal-main">' +
          '<div class="meal-name">' + esc(m.name) + '</div>' +
          '<div class="meal-meta">logged ' + m.count + '× · last ' + fmtDate(m.last) + '</div>' +
        '</div>' +
        '<div class="meal-macros">' +
          '<div class="meal-cal">' + Math.round(m.calories).toLocaleString() + ' <span>kcal</span></div>' +
          '<div class="meal-prot">' + Math.round(m.protein) + 'g protein</div>' +
        '</div>' +
      '</div>'
    ).join('');
  }

  function rebuild(remoteState) {
    const local = { [LOG_KEY]: safeParse(localStorage.getItem(LOG_KEY)), [HIST_KEY]: safeParse(localStorage.getItem(HIST_KEY)) };
    const records = entriesFrom(local).concat(entriesFrom(remoteState || null));
    meals = aggregate(records);
    document.getElementById('mealsLoading').style.display = 'none';
    render();
  }

  // Read-only pull of the cloud "food" row so meals logged on other devices show up too.
  async function pullRemote() {
    if (!window.supabase) { rebuild(null); return; }
    try {
      const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const { data } = await supa.from('app_state').select('data').eq('key', 'food').maybeSingle();
      rebuild(data && data.data ? data.data : null);
    } catch (e) {
      rebuild(null);
    }
  }

  document.getElementById('mealsSearch').addEventListener('input', e => { filter = e.target.value; render(); });

  // First paint from local immediately (fast), then refine with the cloud pull.
  rebuild(null);
  pullRemote();
  window.addEventListener('focus', pullRemote);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pullRemote(); });
})();
</script>
</body>
</html>
